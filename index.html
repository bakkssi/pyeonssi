<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상세페이지</title>
<link rel="preconnect" href="https://o6cdhdutve.execute-api.ap-northeast-2.amazonaws.com">
<link rel="stylesheet" href="https://o6cdhdutve.execute-api.ap-northeast-2.amazonaws.com/v1/api/css/drop_fontstream_css/?sid=gAAAAABq8KDWIP2d42fhmBFyh24C4ptNR3Xks00pujQeqCbpWt7Nsj351xG5GvcAPmZZcNexiw25txqDBdVsXz77D3UcAZBfqC4AVw1P0gTN0nxvZNA8zwndKQzDt7bXj8YwrnU8qHJ0IpEy-SXUVzU1Ta7r-an_I0BPayYft3ct6-RF8Gmj3dhcOP3Vu9aSQNT0MeehuDll_eAD4vzTVKIcPKH1X71ugjFEvR6i7p8OIZx4BncpdtqrFMl3t1vxiP2wvk3frTLR" charset="utf-8" referrerpolicy="origin">
<style>
:root{--pk:#ff8db6;--pk2:#ffc5dd;--pk3:#ffe3ef;--pk4:#fff5f9;--ink:#222222;--ink2:#444444;--mute:#8a7a82}
*{box-sizing:border-box;margin:0;font-weight:400}
/* 안쪽 스크롤바 숨김 (스크롤바 2개 방지) */
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
body{font-family:'Sandoll Hoyoyo2',sans-serif;font-weight:400;font-size:15px;color:var(--ink);background:transparent;padding:20px 16px 60px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-weight:400}
section{max-width:900px;margin:0 auto 44px}

/* ---------- 공통 패널 ---------- */
.pk{background:#fff;border-radius:20px;overflow:hidden;border:2px solid var(--ink)}
.pk-top{background:var(--pk);padding:22px 30px 14px;position:relative;border-bottom:2px solid var(--ink)}
.pk-diamond{position:absolute;inset:0;opacity:.3;background-image:repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 1px,transparent 14px),repeating-linear-gradient(-45deg,#fff 0,#fff 1px,transparent 1px,transparent 14px)}
.pk-in{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.pk-chip{background:var(--ink);color:#fff;font-size:14px;letter-spacing:2px;padding:3px 12px;border-radius:20px;display:inline-block;margin-bottom:6px}
.pk-title{font-size:46px;line-height:1;letter-spacing:3px;color:var(--ink)}
.pk-title.big{font-size:64px}
.pk-sub{font-size:11px;letter-spacing:3px;color:var(--ink);opacity:.7;text-transform:uppercase;margin-top:8px}
.pk-stars{display:flex;gap:5px;align-items:center;position:relative;z-index:1;padding-top:14px;flex-wrap:wrap}
.pk-star{width:9px;height:9px;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#fff;opacity:.9;flex-shrink:0}
.pk-star.sm{width:6px;height:6px;opacity:.6}
.pk-body{padding:20px 28px 26px}
.pk-label{font-size:11px;letter-spacing:3px;color:var(--pk);text-transform:uppercase;margin-bottom:10px}

/* 공통 버튼 */
.btn{font-size:15px;letter-spacing:1px;border:1.5px solid var(--ink);border-radius:10px;padding:9px 18px;background:var(--pk);color:var(--ink);cursor:pointer;transition:background .15s}
.btn:hover{background:var(--pk2)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:var(--pk3)}
.btn:disabled{background:#eee;border-color:#ddd;color:#aaa;cursor:not-allowed}

/* ---------- 작업 일정 (달력) ---------- */
.cal-nav{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.cal-month{font-size:20px;color:var(--ink);letter-spacing:1px}
.cal-btns{display:flex;gap:6px}
.cal-btn{background:#fff;border:1.5px solid var(--ink);color:var(--ink);border-radius:18px;padding:4px 14px;font-size:13px;cursor:pointer;letter-spacing:1px;transition:background .15s,color .15s}
.cal-btn:hover{background:var(--pk3)}
.cal-btn.on{background:var(--ink);color:#fff}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-w{text-align:center;font-size:12px;letter-spacing:2px;color:var(--pk);padding:5px 0}
.cal-w.sat{color:var(--ink2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-cell{min-height:84px;border-radius:12px;border:1px solid var(--pk3);background:#fff;padding:7px 8px 6px;cursor:pointer;transition:border-color .15s,box-shadow .12s;display:flex;flex-direction:column;min-width:0}
.cal-cell:hover{border-color:var(--pk)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cal-cell.today{background:var(--pk3);border-color:var(--pk)}
.cal-cell.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--pk2)}
.cal-cell.sun .cal-num{color:var(--pk)}
.cal-cell.sat .cal-num{color:var(--ink2)}
.cal-num{font-size:15px;color:var(--ink);margin-bottom:4px}
.cal-tags{display:flex;flex-direction:column;gap:2px;flex:1;overflow:hidden}
.cal-tag{font-size:11px;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-tag.closed{background:var(--pk2);color:var(--ink)}
.cal-tag.holiday{background:var(--ink);color:#fff}
.cal-detail{margin-top:14px;padding:12px 16px;border:1.5px dashed var(--pk);border-radius:12px;background:var(--pk4);font-size:15px;color:var(--ink2)}
.cal-detail b{color:var(--ink);font-size:16px;margin-right:8px}
.cal-detail .cal-tag{display:inline-block;font-size:13px;padding:2px 10px;margin:2px 4px 2px 0}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;padding:12px 16px;background:var(--pk4);border-radius:12px;margin-top:14px}
.cal-li{display:flex;align-items:center;gap:6px}
.cal-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.cal-ll{font-size:14px;color:var(--ink2)}
.cal-div{height:1px;background:var(--pk2);margin:16px 0}
.cal-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.cal-fstars{display:flex;flex-direction:column;gap:5px}
.cal-fstars .pk-star{background:var(--pk)}
.cal-frow{display:flex;gap:5px}
.cal-thanks{font-size:15px;letter-spacing:1px;color:var(--pk);text-align:right;line-height:1.7}

/* ---------- 문의 양식 ---------- */
.fq{margin-bottom:22px}
.fl{display:block;font-size:16px;color:var(--ink);letter-spacing:1px;margin-bottom:8px}
.fl b{color:var(--pk);margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.form input[type=text],.form input[type=date],.form select,.form textarea{width:100%;font-size:15px;color:var(--ink);background:#fff;border:1.5px solid var(--pk2);border-radius:9px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--pk3)}
.form textarea{resize:vertical;min-height:110px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:6px 16px;border:1.5px solid var(--pk2);border-radius:18px;background:#fff;cursor:pointer;font-size:15px;letter-spacing:1px;color:var(--ink);transition:background .15s,border-color .15s}
.pill span:hover{background:var(--pk3)}
.pill input:checked+span{background:var(--pk2);border-color:var(--pk)}
.pill input:focus-visible+span{box-shadow:0 0 0 3px var(--pk3)}
.pill em{font-style:normal;font-size:13px;color:var(--mute);margin-left:4px}
.pill input:checked+span em{color:var(--ink)}
.colorrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.colorrow input[type=color]{width:42px;height:42px;border:1.5px solid var(--pk2);border-radius:10px;padding:3px;background:#fff;cursor:pointer}
.colorrow input[type=text]{width:140px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--pk2);border-radius:18px;padding:3px 8px 3px 6px;background:#fff;font-size:14px;color:var(--ink)}
.chip i{width:16px;height:16px;border-radius:50%;border:1px solid #ddd;display:inline-block}
.chip button{border:0;background:none;cursor:pointer;color:var(--mute);font-size:16px;line-height:1}
.chip button:hover{color:var(--pk)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border:1.5px solid var(--pk2);border-radius:12px;background:#fff;cursor:pointer;font-size:15px;color:var(--ink);text-align:left;transition:background .15s,border-color .15s}
.item small{font-size:12px;color:var(--mute)}
.item:hover{border-color:var(--pk)}
.item.filled{background:var(--pk3);border-color:var(--pk)}
.item.filled small{color:var(--ink)}
.editor{display:none;margin-top:12px;border:1.5px dashed var(--pk);border-radius:12px;padding:14px;background:var(--pk4)}
.editor.on{display:block}
.editor h4{font-size:15px;margin-bottom:8px;color:var(--ink)}
.editor .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#f-preview{background:var(--pk4);min-height:240px;resize:none;overflow:hidden;font-size:14px;line-height:1.7}
.check{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:15px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--pk)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .main{flex:1;padding:13px}
.guide{margin-top:14px;font-size:13px;color:var(--mute);line-height:1.8}

/* ---------- 포트폴리오 ---------- */
.ptabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:12px}
.ptab{font-size:15px;letter-spacing:1px;padding:5px 18px;border-radius:18px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
.ptab:hover{background:var(--pk3)}
.ptab.on{background:var(--ink);color:#fff}
.stabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:18px}
.stabs:empty{display:none}
.stab{font-size:13px;letter-spacing:1px;padding:3px 14px;border-radius:14px;border:1.5px solid var(--pk2);background:#fff;color:var(--ink2);cursor:pointer;transition:background .15s}
.stab:hover{background:var(--pk3)}
.stab.on{background:var(--pk);border-color:var(--ink);color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pcard{position:relative;display:block;background:#fff;border:1.5px solid var(--pk2);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-3px);border-color:var(--pk);box-shadow:0 12px 24px -14px rgba(255,141,182,.8)}
.pcard .ttl{text-align:center;font-size:14px;padding:10px 0 4px;color:var(--ink)}
.pcard .ttl::before{content:"⁝ "}
.pcard .ttl::after{content:" ⁝"}
.pcard .tag{position:absolute;top:10px;right:10px;font-size:12px;color:#fff;background:var(--ink);border-radius:6px;padding:1px 8px}
.pcard img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;display:block}
.pempty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
.more{display:block;margin:20px auto 0}
.more[hidden]{display:none}

/* ---------- 공지 ---------- */
.notice{list-style:none}
.notice li{position:relative;padding:6px 0 6px 22px;font-size:15px}
.notice li::before{content:"";position:absolute;left:0;top:13px;width:11px;height:11px;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--pk)}

@media(max-width:640px){.grid2{grid-template-columns:1fr}}
@media(max-width:560px){
  .pk-top{padding:18px 18px 12px}
  .pk-title{font-size:34px}
  .pk-title.big{font-size:42px}
  .pk-body{padding:16px 14px 20px}
  .cal-nav{align-items:flex-start}
  .cal-grid,.cal-wd{gap:3px}
  .cal-cell{min-height:62px;padding:5px 4px;border-radius:9px}
  .cal-num{font-size:13px}
  .cal-tag{font-size:10px;padding:1px 3px}
  .cal-thanks{font-size:13px}
  .pgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- 작업 일정 -->
<section id="sec-schedule">
  <div class="pk">
    <div class="pk-top">
      <div class="pk-diamond"></div>
      <div class="pk-in">
        <div>
          <div class="pk-chip" id="cal-chip"></div>
          <div class="pk-title big" id="cal-title"></div>
          <div class="pk-sub" id="cal-sub"></div>
        </div>
        <div class="cal-nav">
          <div class="cal-month" id="cal-month"></div>
          <div class="cal-btns">
            <button type="button" class="cal-btn" id="cal-this">이번달</button>
            <button type="button" class="cal-btn" id="cal-prev">◂ 이전</button>
            <button type="button" class="cal-btn" id="cal-next">다음 ▸</button>
          </div>
        </div>
      </div>
      <div class="pk-stars"></div>
    </div>
    <div class="pk-body">
      <div class="pk-label">Schedule Overview</div>
      <div class="cal-wd">
        <div class="cal-w">일</div><div class="cal-w">월</div><div class="cal-w">화</div><div class="cal-w">수</div><div class="cal-w">목</div><div class="cal-w">금</div><div class="cal-w sat">토</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-detail" id="cal-detail"></div>
      <div class="cal-legend" id="cal-legend"></div>
      <div class="cal-div"></div>
      <div class="cal-foot">
        <div class="cal-fstars" id="cal-fstars"></div>
        <div class="cal-thanks" id="cal-thanks"></div>
      </div>
    </div>
  </div>
</section>

<!-- 문의 양식 -->
<section id="sec-form">
  <div class="pk">
    <div class="pk-top">
      <div class="pk-diamond"></div>
      <div class="pk-in"><div>
        <div class="pk-chip">문의 양식</div>
        <div class="pk-title">FORM.</div>
        <div class="pk-sub">Commission Request</div>
      </div></div>
      <div class="pk-stars"></div>
    </div>
    <div class="pk-body form">
      <form id="f" onsubmit="return false">

        <div class="grid2">
          <div class="fq"><label class="fl" for="f-nick"><b>1.</b>방송 닉네임 및 주소</label>
            <input type="text" id="f-nick" placeholder="방송 닉네임과 주소를 입력해주세요"></div>
          <div class="fq"><label class="fl" for="f-due"><b>2.</b>수령 희망 날짜</label>
            <input type="date" id="f-due"></div>
          <div class="fq"><label class="fl" for="f-sample"><b>3.</b>희망 샘플 공개일</label>
            <input type="date" id="f-sample"></div>
          <div class="fq" id="f-packwrap"><label class="fl" for="f-pack"><b>4.</b>패키지 선택</label>
            <select id="f-pack"></select></div>
        </div>

        <div class="fq"><label class="fl"><b>5.</b>원하는 색감</label>
          <div class="colorrow">
            <input type="color" id="f-color" value="#ffffff" aria-label="색상 선택">
            <input type="text" id="f-hex" placeholder="#FFFFFF" maxlength="7">
            <button type="button" class="btn" id="f-addcolor">+ 추가</button>
          </div>
          <div class="chips" id="f-chips"></div>
        </div>

        <div class="fq"><label class="fl" for="f-concept"><b>6.</b>원하는 요소 및 디자인 컨셉</label>
          <textarea id="f-concept" placeholder="원하는 색감, 요소, 참고자료 첨부 등 상세한 내용을 적어주세요"></textarea>
          <div class="hint">오마카세 및 부실한 설명으로 시작된 작업은 추후 수정이 어렵습니다.</div></div>

        <div class="fq"><label class="fl"><b>7.</b>추가 옵션</label><div class="pills" id="f-extras"></div></div>
        <div class="fq"><label class="fl"><b>8.</b>빠른 마감 옵션</label><div class="pills" id="f-rush"></div></div>

        <div class="fq"><label class="fl"><b>9.</b>신청 하실 디자인 항목</label>
          <div class="items" id="f-items"></div>
          <div class="editor" id="f-editor">
            <h4 id="f-edtitle"></h4>
            <textarea id="f-edtext" placeholder="수량, 사이즈, 문구 등 이 항목에 필요한 내용을 적어주세요"></textarea>
            <div class="acts">
              <button type="button" class="btn" id="f-edsave">저장 ✦</button>
              <button type="button" class="btn ghost" id="f-eddel">이 항목 삭제</button>
              <button type="button" class="btn ghost" id="f-edclose">닫기</button>
            </div>
          </div>
        </div>

        <div class="fq"><label class="fl" for="f-etc"><b>10.</b>그 외 추가 문의 사항</label>
          <textarea id="f-etc" placeholder="자유롭게 작성해주세요" style="min-height:90px"></textarea></div>

        <div class="fq"><label class="fl" for="f-preview">신청 내용 미리보기</label>
          <textarea id="f-preview" readonly></textarea></div>

        <label class="check"><input type="checkbox" id="f-read"> 공지사항을 다 읽으셨나요?</label>
        <div class="actions">
          <button type="button" class="btn ghost" id="f-reset">↺ 초기화</button>
          <button type="button" class="btn main" id="f-copy" disabled>신청 내용 복사하기</button>
        </div>
        <div class="guide">복사한 내용은 이 페이지의 ‘작가에게 문의하기’ 창에 붙여넣어 보내주세요.<br>
          ※ 결제 전에는 연락처(카톡·DM·메일 등)를 적지 마세요.</div>
      </form>
    </div>
  </div>
</section>

<!-- 포트폴리오 -->
<section id="sec-portfolio">
  <div class="pk">
    <div class="pk-top">
      <div class="pk-diamond"></div>
      <div class="pk-in"><div>
        <div class="pk-chip">포트폴리오</div>
        <div class="pk-title">WORKS.</div>
        <div class="pk-sub">Selected Works</div>
      </div></div>
      <div class="pk-stars"></div>
    </div>
    <div class="pk-body">
      <div class="ptabs" id="p-tabs"></div>
      <div class="stabs" id="p-subs"></div>
      <div class="pgrid" id="p-grid"></div>
      <button type="button" class="btn ghost more" id="p-more" hidden>더보기</button>
    </div>
  </div>
</section>

<!-- 공지사항 -->
<section id="sec-notice">
  <div class="pk">
    <div class="pk-top">
      <div class="pk-diamond"></div>
      <div class="pk-in"><div>
        <div class="pk-chip">공지사항</div>
        <div class="pk-title">NOTICE.</div>
        <div class="pk-sub">Please Read First</div>
      </div></div>
      <div class="pk-stars"></div>
    </div>
    <div class="pk-body"><ul class="notice" id="notice"></ul></div>
  </div>
</section>

<script>
/* ===== 여기만 고치면 돼요 ===== */
const CONFIG = {
  calendar: {
    chip: '마감 캘린더',
    title: 'SCHED.',
    sub: 'Freelancer Schedule Manager',
    hint: '날짜를 눌러 일정을 확인하세요 ♡',
    footer: '편씨 디자인 스튜디오',
    // 하루: {date:'2026-11-19', name:'작업불가', type:'holiday'}
    // 기간: {from:'2026-11-26', to:'2026-11-27', name:'작업불가', type:'holiday'}
    // type: closed(마감) / holiday(작업불가)
    events: [
      {date:'2026-11-15', name:'마감', type:'closed'},
      {date:'2026-11-19', name:'작업불가', type:'holiday'},
      {from:'2026-11-26', to:'2026-11-27', name:'작업불가', type:'holiday'},
      {date:'2026-11-30', name:'접수 마감', type:'closed'}
    ]
  },
  notice: [
    '작업은 입금 확인 후 시작합니다.',
    '수정은 기본 2회 제공됩니다.',
    '제작 샘플은 포트폴리오로 공개될 수 있습니다.'
  ],
  form: {
    packages: [],   // 패키지 선택 칸을 쓰려면 ['Basic 패키지', 'Standard 패키지'] 처럼 채우세요 (비워두면 칸이 숨겨져요)
    // price: 추가금 (원). 0 또는 생략하면 금액 표시 없음 — 아래 금액은 임시 값이에요!
    extras: [
      {name:'PSD 파일 구매', price:50000},
      {name:'포트폴리오 비공개', price:20000},
      {name:'상업용 전환', price:30000}
    ],
    rush: [   // '선택 안함'은 자동 추가
      {name:'3일 이내', price:15000},
      {name:'2일 이내', price:25000},
      {name:'1일 이내', price:40000}
    ],
    items: ['포스터','RT포스터','PPT','스케줄표','유튜브','SOOP 배너','치지직 배너','대기화면','로고','다시보기','썸네일','그 외 디자인']
  },
  portfolio: {
    pageSize: 6,
    cats: ['Overlay', 'CSS', 'Schedule', 'Poster', 'RTPoster'],
    items: [
      {cat:'CSS', sub:'후원', img:'https://placehold.co/800x600/FFE3EF/222222?text=CSS+1'},
      {cat:'CSS', sub:'후원', img:'https://placehold.co/800x600/FFE3EF/222222?text=CSS+2'},
      {cat:'CSS', sub:'애니메이션', img:'https://placehold.co/800x600/FFE3EF/222222?text=CSS+3'},
      {cat:'CSS', sub:'애니메이션', img:'https://placehold.co/800x600/FFE3EF/222222?text=CSS+4'},
      {cat:'Overlay', img:'https://placehold.co/800x600/FFE3EF/222222?text=Overlay+1'},
      {cat:'Overlay', img:'https://placehold.co/800x600/FFE3EF/222222?text=Overlay+2'},
      {cat:'Schedule', img:'https://placehold.co/800x600/FFE3EF/222222?text=Schedule+1'},
      {cat:'Poster', img:'https://placehold.co/800x600/FFE3EF/222222?text=Poster+1'},
      {cat:'RTPoster', img:'https://placehold.co/800x600/FFE3EF/222222?text=RTPoster+1'}
    ]
  }
};
/* ============================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const starHTML = (n, sm) => Array(n).fill(`<div class="pk-star${sm ? ' sm' : ''}"></div>`).join('');

/* 헤더 별 장식 */
document.querySelectorAll('.pk-stars').forEach(el => { el.innerHTML = starHTML(22) + starHTML(5, true); });

/* 공지 */
$('notice').innerHTML = CONFIG.notice.map(t => `<li>${t}</li>`).join('');

/* ===== 작업 일정 (달력, 읽기 전용) ===== */
const C = CONFIG.calendar;
const TYPES = {
  closed:  {label:'마감',     dot:'background:#ffc5dd;border:1.5px solid #ff8db6'},
  holiday: {label:'작업불가', dot:'background:#222222'}
};
const pad = n => String(n).padStart(2, '0');
const mk = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const evMap = {};
C.events.forEach(e => {
  const from = e.from || e.date, to = e.to || from;
  if (!from) return;
  const [fy, fm, fd] = from.split('-').map(Number);
  const [ty, tm, td] = to.split('-').map(Number);
  const cur = new Date(fy, fm - 1, fd), end = new Date(ty, tm - 1, td);
  for (let n = 0; cur <= end && n < 400; n++) {
    const k = mk(cur.getFullYear(), cur.getMonth(), cur.getDate());
    (evMap[k] = evMap[k] || []).push({name: e.name, type: TYPES[e.type] ? e.type : 'closed'});
    cur.setDate(cur.getDate() + 1);
  }
});

const today = new Date();
let vy = today.getFullYear(), vm = today.getMonth(), selKey = null;

$('cal-chip').textContent = C.chip;
$('cal-title').textContent = C.title;
$('cal-sub').textContent = C.sub;
$('cal-fstars').innerHTML = `<div class="cal-frow">${starHTML(5)}</div><div class="cal-frow">${starHTML(3)}</div>`;
$('cal-thanks').innerHTML = `${esc(C.hint)}<br>${esc(C.footer)}`;
$('cal-legend').innerHTML = Object.keys(TYPES).map(k =>
  `<div class="cal-li"><div class="cal-dot" style="${TYPES[k].dot}"></div><span class="cal-ll">${TYPES[k].label}</span></div>`).join('');

function renderDetail(){
  const box = $('cal-detail');
  if (!selKey) { box.innerHTML = esc(C.hint); return; }
  const [y, m, d] = selKey.split('-').map(Number);
  const evs = evMap[selKey] || [];
  box.innerHTML = `<b>${m}월 ${d}일</b>` + (evs.length
    ? evs.map(e => `<span class="cal-tag ${e.type}">${esc(e.name)}</span>`).join('')
    : '등록된 일정이 없어요');
}
function renderCal(){
  const grid = $('cal-grid');
  grid.innerHTML = '';
  $('cal-month').textContent = `${vy}년 ${vm + 1}월`;
  $('cal-this').className = 'cal-btn' + (vy === today.getFullYear() && vm === today.getMonth() ? ' on' : '');
  const first = new Date(vy, vm, 1).getDay();
  const days = new Date(vy, vm + 1, 0).getDate();
  for (let i = 0; i < first; i++) {
    const e = document.createElement('div'); e.className = 'cal-cell empty'; grid.appendChild(e);
  }
  for (let d = 1; d <= days; d++) {
    const dow = (first + d - 1) % 7, key = mk(vy, vm, d);
    const isToday = vy === today.getFullYear() && vm === today.getMonth() && d === today.getDate();
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (isToday ? ' today' : '') + (dow === 0 ? ' sun' : '') + (dow === 6 ? ' sat' : '') + (key === selKey ? ' sel' : '');
    cell.innerHTML = `<div class="cal-num">${d}</div><div class="cal-tags">` +
      (evMap[key] || []).map(e => `<div class="cal-tag ${e.type}">${esc(e.name)}</div>`).join('') + '</div>';
    cell.onclick = () => { selKey = key; renderCal(); renderDetail(); };
    grid.appendChild(cell);
  }
}
function changeMo(n){
  vm += n;
  if (vm > 11) { vm = 0; vy++; }
  if (vm < 0) { vm = 11; vy--; }
  selKey = null; renderCal(); renderDetail();
}
$('cal-prev').onclick = () => changeMo(-1);
$('cal-next').onclick = () => changeMo(1);
$('cal-this').onclick = () => { vy = today.getFullYear(); vm = today.getMonth(); selKey = null; renderCal(); renderDetail(); };
renderCal(); renderDetail();

/* ===== 포트폴리오 ===== */
const P = CONFIG.portfolio;
let pcat = 'ALL', psub = '전체', pshown = P.pageSize;

function renderPortfolio(){
  $('p-tabs').innerHTML = ['ALL', ...P.cats].map(c =>
    `<button type="button" class="ptab ${c === pcat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const subs = pcat === 'ALL' ? [] : [...new Set(P.items.filter(i => i.cat === pcat && i.sub).map(i => i.sub))];
  $('p-subs').innerHTML = subs.length
    ? ['전체', ...subs].map(s => `<button type="button" class="stab ${s === psub ? 'on' : ''}" data-s="${esc(s)}">${esc(s)}</button>`).join('')
    : '';
  const list = P.items.filter(i => (pcat === 'ALL' || i.cat === pcat) && (psub === '전체' || i.sub === psub));
  $('p-grid').innerHTML = list.length
    ? list.slice(0, pshown).map(i =>
        `<a class="pcard" href="${esc(i.img)}" target="_blank" rel="noopener">
           <span class="tag">${esc(i.cat)}</span>
           <div class="ttl" ${i.color ? `style="color:${esc(i.color)}"` : ''}>${esc(i.title || i.cat + ' Design')}</div>
           <img src="${esc(i.img)}" alt="${esc(i.cat)} 포트폴리오" loading="lazy">
         </a>`).join('')
    : '<div class="pempty">아직 등록된 작업이 없어요</div>';
  $('p-more').hidden = list.length <= pshown;
}
$('p-tabs').addEventListener('click', e => {
  const b = e.target.closest('.ptab'); if (!b) return;
  pcat = b.dataset.c; psub = '전체'; pshown = P.pageSize; renderPortfolio();
});
$('p-subs').addEventListener('click', e => {
  const b = e.target.closest('.stab'); if (!b) return;
  psub = b.dataset.s; pshown = P.pageSize; renderPortfolio();
});
$('p-more').onclick = () => { pshown += P.pageSize; renderPortfolio(); };
renderPortfolio();

/* ===== 문의 양식 ===== */
const F = CONFIG.form;
const RUSH = [{name:'선택 안함', price:0}, ...F.rush];
const won = n => n ? ` (+${n.toLocaleString()}원)` : '';
const priceTag = n => n ? `<em>+${n.toLocaleString()}원</em>` : '';
let colors = [];
let items = {};
let current = null;

if (F.packages.length) $('f-pack').innerHTML = F.packages.map(p => `<option>${esc(p)}</option>`).join('');
else $('f-packwrap').style.display = 'none';

$('f-extras').innerHTML = F.extras.map((e, i) =>
  `<label class="pill"><input type="checkbox" name="extra" value="${i}"><span>${esc(e.name)} ${priceTag(e.price)}</span></label>`).join('');
$('f-rush').innerHTML = RUSH.map((r, i) =>
  `<label class="pill"><input type="radio" name="rush" value="${i}" ${i === 0 ? 'checked' : ''}><span>${esc(r.name)} ${priceTag(r.price)}</span></label>`).join('');

function renderItems(){
  $('f-items').innerHTML = F.items.map(n =>
    `<button type="button" class="item ${items[n] ? 'filled' : ''}" data-n="${esc(n)}"><span>${esc(n)}</span><small>${items[n] ? '입력됨 ✓' : '입력하기 ›'}</small></button>`).join('');
}
function renderChips(){
  $('f-chips').innerHTML = colors.map((c, i) =>
    `<span class="chip"><i style="background:${c}"></i>${c}<button type="button" data-i="${i}" aria-label="삭제">×</button></span>`).join('');
}
function closeEditor(){ current = null; $('f-editor').classList.remove('on'); }

$('f-items').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  current = b.dataset.n;
  $('f-edtitle').textContent = current + ' 입력';
  $('f-edtext').value = items[current] || '';
  $('f-editor').classList.add('on');
  $('f-edtext').focus();
});
$('f-edsave').onclick = () => {
  const t = $('f-edtext').value.trim();
  if (t) items[current] = t; else delete items[current];
  closeEditor(); renderItems(); update();
};
$('f-eddel').onclick = () => { delete items[current]; closeEditor(); renderItems(); update(); };
$('f-edclose').onclick = closeEditor;

$('f-color').addEventListener('input', () => { $('f-hex').value = $('f-color').value.toUpperCase(); });
$('f-hex').addEventListener('input', () => {
  const v = $('f-hex').value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) $('f-color').value = v;
});
$('f-addcolor').onclick = () => {
  let v = ($('f-hex').value.trim() || $('f-color').value).toUpperCase();
  if (!v.startsWith('#')) v = '#' + v;
  if (!/^#[0-9A-F]{6}$/.test(v)) { $('f-hex').focus(); return; }
  if (!colors.includes(v)) colors.push(v);
  renderChips(); update();
};
$('f-chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  colors.splice(+b.dataset.i, 1); renderChips(); update();
});

const v = id => $(id).value.trim() || '(미입력)';
function buildText(){
  const exs = [...document.querySelectorAll('input[name=extra]:checked')].map(x => F.extras[+x.value]);
  const rs = RUSH[+document.querySelector('input[name=rush]:checked').value];
  const sum = exs.reduce((a, e) => a + (e.price || 0), 0) + (rs.price || 0);
  const lines = Object.keys(items).map(k => `- ${k} : ${items[k].replace(/\n/g, '\n  ')}`);
  return [
    '[ 신청 내용 ]', '',
    `방송 닉네임 및 주소 : ${v('f-nick')}`,
    `수령 희망 날짜 : ${v('f-due')}`,
    `희망 샘플 공개일 : ${v('f-sample')}`,
    ...(F.packages.length ? [`패키지 선택 : ${$('f-pack').value}`] : []),
    `원하는 색감 : ${colors.length ? colors.join(', ') : '(미입력)'}`,
    `원하는 요소 및 디자인 컨셉 : ${v('f-concept')}`, '',
    '[ 추가 옵션 ]',
    exs.length ? exs.map(e => `- ${e.name}${won(e.price)}`).join('\n') : '- 없음', '',
    `빠른 마감 옵션 : ${rs.name}${won(rs.price)}`,
    ...(sum ? [`추가금 합계 : +${sum.toLocaleString()}원`] : []), '',
    '[ 신청 디자인 항목 ]',
    lines.length ? lines.join('\n') : '- (미선택)', '',
    '[ 그 외 추가 문의 사항 ]',
    v('f-etc')
  ].join('\n');
}
function update(){
  const ta = $('f-preview');
  ta.value = buildText();
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight + 4) + 'px';   // 미리보기 칸 안에 스크롤바가 생기지 않게 자동 높이
  $('f-copy').disabled = !$('f-read').checked;
}
$('f').addEventListener('input', update);
$('f').addEventListener('change', update);

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = $('f-preview'); ta.removeAttribute('readonly'); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.setAttribute('readonly', ''); return ok;
  }
}
$('f-copy').onclick = async () => {
  const ok = await copyText($('f-preview').value);
  const b = $('f-copy'), old = '신청 내용 복사하기';
  b.textContent = ok ? '복사 완료! 문의창에 붙여넣어 주세요' : '복사 실패 · 미리보기를 직접 복사해 주세요';
  setTimeout(() => b.textContent = old, 2800);
};
$('f-reset').onclick = () => {
  $('f').reset(); colors = []; items = {}; closeEditor(); renderChips(); renderItems(); update();
};
renderItems(); renderChips(); update();

/* ===== 부모(아트머그)에 높이와 앵커 위치 전달 ===== */
const ANCHORS = {schedule:'sec-schedule', form:'sec-form', portfolio:'sec-portfolio', notice:'sec-notice'};
const docH = () => Math.ceil(document.body.getBoundingClientRect().height);
let lastH = 0;
function send(){
  const anchors = {};
  for (const k in ANCHORS) anchors[k] = $(ANCHORS[k]).getBoundingClientRect().top + scrollY;
  lastH = docH();
  parent.postMessage({type:'embedHeight', height:lastH, anchors}, '*');
}
addEventListener('message', e => { if (e.data && e.data.type === 'requestHeight') send(); });
addEventListener('load', send);
addEventListener('resize', send);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(send);
new ResizeObserver(send).observe(document.body);
setInterval(() => { if (docH() !== lastH) send(); }, 600);   // 글꼴·이미지가 늦게 불러와져도 높이 재전송
</script>
</body>
</html>
