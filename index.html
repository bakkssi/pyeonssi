<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상세페이지</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Noto+Sans+KR:wght@300;400;500&display=swap');
@font-face{font-family:'SchoolFont';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimAllimjangTTF-R.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'SchoolFont';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimAllimjangTTF-B.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Paperozi';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Paperozi';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}

:root{--main:#F296BD;--deep:#D9739F;--soft:#FFF0F6;--line:#FBDCE9;--text:#4A3943}
*{box-sizing:border-box;margin:0}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;color:var(--text);background:transparent;padding:20px 16px 60px;line-height:1.7}
section{max-width:860px;margin:0 auto 70px}
h2{font-size:26px;margin-bottom:18px}
h2::before{content:"";display:inline-block;width:5px;height:22px;background:var(--main);border-radius:3px;margin-right:10px;vertical-align:-3px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:22px 26px}
.notice li{margin-left:18px;margin-bottom:6px}
.price-group{margin-bottom:22px}
.price-group h3{font-size:18px;color:var(--deep);margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row b{white-space:nowrap}

/* ---------- 작업 일정 (달력) ---------- */
.cal{background:#fff;border-radius:20px;overflow:hidden;border:1.5px solid #f5c6dc;font-family:'Noto Sans KR',sans-serif;font-weight:300;line-height:1.5}
.cal-top{background:#fce8f2;padding:26px 32px 18px;position:relative}
.cal-diamond{position:absolute;inset:0;opacity:.22;background-image:repeating-linear-gradient(45deg,#ef94bc 0,#ef94bc 1px,transparent 1px,transparent 14px),repeating-linear-gradient(-45deg,#ef94bc 0,#ef94bc 1px,transparent 1px,transparent 14px)}
.cal-top-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.cal-chip{background:#ef94bc;color:#fff;font-family:'SchoolFont',sans-serif;font-size:13px;letter-spacing:2px;padding:3px 11px;border-radius:20px;display:inline-block;margin-bottom:6px}
.cal-title{font-family:'Playfair Display',serif;font-weight:700;font-style:italic;font-size:62px;line-height:1;letter-spacing:2px;color:#c4527e}
.cal-sub{font-size:9px;letter-spacing:3px;color:#d48aab;text-transform:uppercase;margin-top:8px}
.cal-nav{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.cal-month{font-family:'SchoolFont',sans-serif;font-size:17px;color:#c4527e;letter-spacing:1px}
.cal-btns{display:flex;gap:6px}
.cal-btn{background:#fff;border:1.5px solid #f5c6dc;color:#ef94bc;border-radius:18px;padding:5px 14px;font-size:12px;font-family:'SchoolFont',sans-serif;cursor:pointer;letter-spacing:1px;transition:background .15s}
.cal-btn:hover{background:#fce8f2}
.cal-btn.on{background:#ef94bc;color:#fff;border-color:#ef94bc}
.cal-stars{display:flex;gap:5px;align-items:center;position:relative;z-index:1;padding-top:14px;flex-wrap:wrap}
.cal-star{width:9px;height:9px;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#ef94bc;opacity:.55;flex-shrink:0}
.cal-star.sm{width:6px;height:6px;opacity:.35}
.cal-body{padding:20px 28px 26px}
.cal-label{font-size:9px;letter-spacing:3px;color:#ef94bc;text-transform:uppercase;margin-bottom:10px;font-weight:500}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-w{text-align:center;font-size:10px;letter-spacing:2px;color:#ef94bc;padding:5px 0;font-weight:500}
.cal-w.sat{color:#88b4d8}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-cell{min-height:84px;border-radius:12px;border:.5px solid #fce8f2;background:#fff;padding:7px 8px 6px;cursor:pointer;transition:border-color .15s,box-shadow .12s;display:flex;flex-direction:column;min-width:0}
.cal-cell:hover{border-color:#f5c6dc;box-shadow:0 0 0 2.5px #fce8f255}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cal-cell.today{background:#fce8f2;border-color:#ef94bc}
.cal-cell.sel{border-color:#ef94bc;box-shadow:0 0 0 2.5px #fce8f2}
.cal-cell.sun .cal-num{color:#e8609a}
.cal-cell.sat .cal-num{color:#88b4d8}
.cal-num{font-size:14px;font-weight:500;color:#555;margin-bottom:4px}
.cal-cell.today .cal-num{color:#c4527e;font-weight:700}
.cal-tags{display:flex;flex-direction:column;gap:2px;flex:1;overflow:hidden}
.cal-tag{font-family:'SchoolFont',sans-serif;font-size:9px;border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-tag.closed{background:#fce8f2;color:#c4527e}
.cal-tag.holiday{background:#f5c6dc;color:#9e3060}
.cal-tag.deadline{background:#fff3cd;color:#8a6000}
.cal-tag.inprogress{background:#e0f4e8;color:#2d7a45}
.cal-tag.custom{background:#e8e8fc;color:#5050c0}
.cal-detail{margin-top:14px;padding:12px 16px;border:1.5px dashed #f5c6dc;border-radius:12px;background:#fffafc;font-size:14px;color:#8f6c7e}
.cal-detail b{font-family:'SchoolFont',sans-serif;font-weight:400;color:#c4527e;font-size:15px;margin-right:8px}
.cal-detail .cal-tag{display:inline-block;font-size:12px;padding:3px 9px;margin:2px 4px 2px 0}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px;background:#fdf2f7;border-radius:12px;margin-top:14px}
.cal-li{display:flex;align-items:center;gap:6px}
.cal-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.cal-ll{font-family:'SchoolFont',sans-serif;font-size:12px;color:#c48aaa}
.cal-div{height:.5px;background:#f5c6dc;margin:16px 0}
.cal-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.cal-fstars{display:flex;flex-direction:column;gap:5px}
.cal-frow{display:flex;gap:5px}
.cal-thanks{font-family:'Paperozi',sans-serif;font-weight:500;font-size:14px;letter-spacing:1px;color:#ef94bc;text-align:right;line-height:1.7}
@media(max-width:560px){
  .cal-top{padding:20px 18px 14px}
  .cal-title{font-size:40px}
  .cal-nav{align-items:flex-start}
  .cal-body{padding:16px 12px 20px}
  .cal-grid,.cal-wd{gap:3px}
  .cal-cell{min-height:62px;padding:5px 4px;border-radius:9px}
  .cal-num{font-size:12px}
  .cal-tag{font-size:8px;padding:1px 3px}
  .cal-thanks{font-size:12px}
}

/* ---------- 문의 양식 ---------- */
.form .q{margin-bottom:22px}
.form label.t{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.form label.t b{color:var(--main);margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.form input[type=text],.form input[type=date],.form select,.form textarea{width:100%;font:inherit;font-size:15px;color:var(--text);background:#faf7f8;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--main);box-shadow:0 0 0 3px #FFE3EF}
.form textarea{resize:vertical;min-height:110px}
.hint{font-size:13px;color:#8f858b;margin-top:6px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:9px 18px;border:1.5px solid var(--line);border-radius:99px;background:#fff;cursor:pointer;font-size:15px;transition:background .2s,border-color .2s}
.pill input:checked+span{background:#FFD6E6;border-color:var(--main);font-weight:700}
.pill input:focus-visible+span{box-shadow:0 0 0 3px #FFE3EF}
.colorrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.colorrow input[type=color]{width:46px;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:3px;background:#fff;cursor:pointer}
.colorrow input[type=text]{width:140px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--main);color:#fff;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--text);border:1.5px solid var(--line)}
.btn:disabled{background:#ddd;color:#fff;cursor:not-allowed;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:99px;padding:4px 8px 4px 6px;background:#fff;font-size:14px}
.chip i{width:18px;height:18px;border-radius:50%;border:1px solid #ddd;display:inline-block}
.chip button{border:0;background:none;cursor:pointer;color:#999;font-size:16px;line-height:1}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font:inherit;font-size:15px;color:var(--text);text-align:left;transition:background .2s,border-color .2s}
.item small{font-size:12px;font-weight:700;color:#8f858b}
.item:hover{border-color:var(--main)}
.item.filled{background:var(--soft);border-color:var(--main)}
.item.filled small{color:var(--deep)}
.editor{display:none;margin-top:12px;border:1.5px dashed var(--main);border-radius:14px;padding:14px;background:#FFFAFC}
.editor.on{display:block}
.editor h4{font-size:15px;margin-bottom:8px;color:var(--deep)}
.editor .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#f-preview{background:#FFF8FB;border-color:var(--line);min-height:240px;max-height:320px;font-size:14px;line-height:1.7}
.check{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--main)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .main{flex:1;padding:15px}
.guide{margin-top:14px;font-size:13px;color:#8f858b;line-height:1.7}

/* ---------- 포트폴리오 ---------- */
.ptabs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:14px}
.ptab{font:inherit;font-weight:700;font-size:15px;padding:9px 22px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:#8f858b;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.ptab:hover{border-color:var(--main)}
.ptab.on{background:var(--main);border-color:var(--main);color:#fff}
.stabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.stabs:empty{display:none}
.stab{font:inherit;font-weight:700;font-size:13px;padding:5px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:#8f858b;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.stab:hover{border-color:var(--deep)}
.stab.on{background:var(--deep);border-color:var(--deep);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:560px){.pgrid{grid-template-columns:1fr}}
.pcard{position:relative;display:block;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-3px);border-color:var(--main);box-shadow:0 12px 24px -14px rgba(226,110,160,.6)}
.pcard .ttl{text-align:center;font-size:13px;font-weight:700;padding:10px 0 4px;color:var(--deep)}
.pcard .ttl::before{content:"⁝ "}
.pcard .ttl::after{content:" ⁝"}
.pcard .tag{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;color:#fff;background:#666;border-radius:6px;padding:2px 8px}
.pcard img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;display:block}
.pempty{grid-column:1/-1;text-align:center;color:#8f858b;padding:40px 0}
.more{display:block;margin:22px auto 0}
.more[hidden]{display:none}
</style>
</head>
<body>

<section id="sec-schedule">
  <h2>작업 일정</h2>
  <div class="cal">
    <div class="cal-top">
      <div class="cal-diamond"></div>
      <div class="cal-top-inner">
        <div>
          <div class="cal-chip" id="cal-chip"></div>
          <div class="cal-title" id="cal-title"></div>
          <div class="cal-sub" id="cal-sub"></div>
        </div>
        <div class="cal-nav">
          <div class="cal-month" id="cal-month"></div>
          <div class="cal-btns">
            <button type="button" class="cal-btn" id="cal-this">이번달</button>
            <button type="button" class="cal-btn" id="cal-prev">◂ 이전</button>
            <button type="button" class="cal-btn" id="cal-next">다음 ▸</button>
          </div>
        </div>
      </div>
      <div class="cal-stars" id="cal-stars"></div>
    </div>
    <div class="cal-body">
      <div class="cal-label">Schedule Overview</div>
      <div class="cal-wd">
        <div class="cal-w">일</div><div class="cal-w">월</div><div class="cal-w">화</div><div class="cal-w">수</div><div class="cal-w">목</div><div class="cal-w">금</div><div class="cal-w sat">토</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-detail" id="cal-detail"></div>
      <div class="cal-legend" id="cal-legend"></div>
      <div class="cal-div"></div>
      <div class="cal-foot">
        <div class="cal-fstars" id="cal-fstars"></div>
        <div class="cal-thanks" id="cal-thanks"></div>
      </div>
    </div>
  </div>
</section>

<section id="sec-form">
  <h2>문의 양식</h2>
  <div class="card form">
    <form id="f" onsubmit="return false">

      <div class="grid2">
        <div class="q"><label class="t" for="f-nick"><b>1.</b>방송 닉네임 및 주소</label>
          <input type="text" id="f-nick" placeholder="방송 닉네임과 주소를 입력해주세요"></div>
        <div class="q"><label class="t" for="f-due"><b>2.</b>수령 희망 날짜</label>
          <input type="date" id="f-due"></div>
        <div class="q"><label class="t" for="f-sample"><b>3.</b>희망 샘플 공개일</label>
          <input type="date" id="f-sample"></div>
        <div class="q"><label class="t" for="f-pack"><b>4.</b>패키지 선택</label>
          <select id="f-pack"></select></div>
      </div>

      <div class="q"><label class="t"><b>5.</b>원하는 색감</label>
        <div class="colorrow">
          <input type="color" id="f-color" value="#ffffff" aria-label="색상 선택">
          <input type="text" id="f-hex" placeholder="#FFFFFF" maxlength="7">
          <button type="button" class="btn" id="f-addcolor">+ 추가</button>
        </div>
        <div class="chips" id="f-chips"></div>
      </div>

      <div class="q"><label class="t" for="f-concept"><b>6.</b>원하는 요소 및 디자인 컨셉</label>
        <textarea id="f-concept" placeholder="원하는 색감, 요소, 참고자료 첨부 등 상세한 내용을 적어주세요"></textarea>
        <div class="hint">오마카세 및 부실한 설명으로 시작된 작업은 추후 수정이 어렵습니다.</div></div>

      <div class="q"><label class="t"><b>7.</b>추가 옵션</label><div class="pills" id="f-extras"></div></div>
      <div class="q"><label class="t"><b>8.</b>빠른 마감 옵션</label><div class="pills" id="f-rush"></div></div>

      <div class="q"><label class="t"><b>9.</b>신청 하실 디자인 항목</label>
        <div class="items" id="f-items"></div>
        <div class="editor" id="f-editor">
          <h4 id="f-edtitle"></h4>
          <textarea id="f-edtext" placeholder="수량, 사이즈, 문구 등 이 항목에 필요한 내용을 적어주세요"></textarea>
          <div class="acts">
            <button type="button" class="btn" id="f-edsave">저장</button>
            <button type="button" class="btn ghost" id="f-eddel">이 항목 삭제</button>
            <button type="button" class="btn ghost" id="f-edclose">닫기</button>
          </div>
        </div>
      </div>

      <div class="q"><label class="t" for="f-etc"><b>10.</b>그 외 추가 문의 사항</label>
        <textarea id="f-etc" placeholder="자유롭게 작성해주세요" style="min-height:90px"></textarea></div>

      <div class="q"><label class="t" for="f-preview">신청 내용 미리보기</label>
        <textarea id="f-preview" readonly></textarea></div>

      <label class="check"><input type="checkbox" id="f-read"> 공지사항을 다 읽으셨나요?</label>
      <div class="actions">
        <button type="button" class="btn ghost" id="f-reset">↺ 초기화</button>
        <button type="button" class="btn main" id="f-copy" disabled>신청 내용 복사하기</button>
      </div>
      <div class="guide">복사한 내용은 이 페이지의 <b>‘작가에게 문의하기’</b> 창에 붙여넣어 보내주세요.<br>
        ※ 결제 전에는 연락처(카톡·DM·메일 등)를 적지 마세요.</div>
    </form>
  </div>
</section>

<section id="sec-portfolio">
  <h2>포트폴리오</h2>
  <div class="ptabs" id="p-tabs"></div>
  <div class="stabs" id="p-subs"></div>
  <div class="pgrid" id="p-grid"></div>
  <button type="button" class="btn ghost more" id="p-more" hidden>더보기</button>
</section>

<section id="sec-notice"><h2>공지사항</h2><div class="card"><ul class="notice" id="notice"></ul></div></section>
<section id="sec-price"><h2>패키지</h2><div class="card" id="price"></div></section>

<script>
/* ===== 여기만 고치면 돼요 ===== */
const CONFIG = {
  calendar: {
    chip: '마감 캘린더',
    title: 'SCHED.',
    sub: 'Freelancer Schedule Manager',
    hint: '날짜를 눌러 일정을 확인하세요 ♡',
    footer: '편씨 디자인 스튜디오',
    // 일정 추가 방법: 아래 줄을 복사해서 날짜/이름/종류만 바꾸세요
    // 하루: {date:'2026-11-19', name:'작업불가', type:'holiday'}
    // 기간: {from:'2026-11-26', to:'2026-11-27', name:'작업불가', type:'holiday'}
    // type: closed(마감) / holiday(작업불가) / deadline(납품일) / inprogress(진행중) / custom(기타)
    events: [
      {from:'2026-11-10', to:'2026-11-14', name:'작업 진행중', type:'inprogress'},
      {date:'2026-11-15', name:'포스터 납품', type:'deadline'},
      {date:'2026-11-19', name:'작업불가', type:'holiday'},
      {from:'2026-11-26', to:'2026-11-27', name:'작업불가', type:'holiday'},
      {date:'2026-11-30', name:'접수 마감', type:'closed'}
    ]
  },
  notice: [
    '작업은 입금 확인 후 시작합니다.',
    '수정은 기본 2회 제공됩니다.',
    '제작 샘플은 포트폴리오로 공개될 수 있습니다.'
  ],
  price: [
    {group:'포스터', items:[['일반 홍보 포스터',20000],['가로형 썸네일',45000]]},
    {group:'배너', items:[['상단배너',40000],['하단배너',30000]]}
  ],
  form: {
    packages: ['없음', 'Basic 패키지', 'Standard 패키지', 'Premium 패키지'],
    extras:   ['PSD 파일 구매', '포트폴리오 비공개', '상업용 전환'],
    rush:     ['3일 이내', '2일 이내', '1일 이내'],   // '선택 안함'은 자동 추가
    items:    ['포스터','RT포스터','PPT','스케줄표','유튜브','SOOP 배너','치지직 배너','대기화면','로고','다시보기','썸네일','그 외 디자인']
  },
  portfolio: {
    pageSize: 6,
    cats: ['Overlay', 'CSS', 'Schedule', 'Poster', 'RTPoster'],
    items: [
      {cat:'CSS', sub:'후원', img:'https://placehold.co/800x600/FFF0F6/D9739F?text=CSS+1', color:'#D9739F'},
      {cat:'CSS', sub:'후원', img:'https://placehold.co/800x600/FFF0F6/D9739F?text=CSS+2', color:'#9c3d3d'},
      {cat:'CSS', sub:'애니메이션', img:'https://placehold.co/800x600/FFF0F6/D9739F?text=CSS+3', color:'#c9a227'},
      {cat:'CSS', sub:'애니메이션', img:'https://placehold.co/800x600/FFF0F6/D9739F?text=CSS+4'},
      {cat:'Overlay', img:'https://placehold.co/800x600/F0F5FF/6b8ad9?text=Overlay+1'},
      {cat:'Overlay', img:'https://placehold.co/800x600/F0F5FF/6b8ad9?text=Overlay+2'},
      {cat:'Schedule', img:'https://placehold.co/800x600/FFF8F0/d9a273?text=Schedule+1'},
      {cat:'Poster', img:'https://placehold.co/800x600/F5F0FF/9a73d9?text=Poster+1'},
      {cat:'RTPoster', img:'https://placehold.co/800x600/F0FFF7/73d9a2?text=RTPoster+1'}
    ]
  }
};
/* ============================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 공지 / 패키지 */
$('notice').innerHTML = CONFIG.notice.map(t => `<li>${t}</li>`).join('');
$('price').innerHTML = CONFIG.price.map(g =>
  `<div class="price-group"><h3>${g.group}</h3>${g.items.map(i =>
    `<div class="row"><span>${i[0]}</span><b>${i[1].toLocaleString()}원</b></div>`).join('')}</div>`).join('');

/* ===== 작업 일정 (달력, 읽기 전용) ===== */
const C = CONFIG.calendar;
const TYPES = {
  closed:     {label:'마감',     dot:'background:#fce8f2;border:1px solid #f5c6dc'},
  holiday:    {label:'작업불가', dot:'background:#f5c6dc'},
  deadline:   {label:'납품일',   dot:'background:#fff3cd'},
  inprogress: {label:'진행중',   dot:'background:#e0f4e8'},
  custom:     {label:'기타',     dot:'background:#e8e8fc'}
};
const pad = n => String(n).padStart(2, '0');
const mk = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const evMap = {};
C.events.forEach(e => {
  const from = e.from || e.date, to = e.to || from;
  if (!from) return;
  const [fy, fm, fd] = from.split('-').map(Number);
  const [ty, tm, td] = to.split('-').map(Number);
  const cur = new Date(fy, fm - 1, fd), end = new Date(ty, tm - 1, td);
  for (let n = 0; cur <= end && n < 400; n++) {
    const k = mk(cur.getFullYear(), cur.getMonth(), cur.getDate());
    (evMap[k] = evMap[k] || []).push({name: e.name, type: TYPES[e.type] ? e.type : 'custom'});
    cur.setDate(cur.getDate() + 1);
  }
});

const today = new Date();
let vy = today.getFullYear(), vm = today.getMonth(), selKey = null;
const starHTML = (n, sm) => Array(n).fill(`<div class="cal-star${sm ? ' sm' : ''}"></div>`).join('');

$('cal-chip').textContent = C.chip;
$('cal-title').textContent = C.title;
$('cal-sub').textContent = C.sub;
$('cal-stars').innerHTML = starHTML(22) + starHTML(5, true);
$('cal-fstars').innerHTML = `<div class="cal-frow">${starHTML(5)}</div><div class="cal-frow">${starHTML(3)}</div>`;
$('cal-thanks').innerHTML = `${esc(C.hint)}<br>${esc(C.footer)}`;
$('cal-legend').innerHTML = Object.keys(TYPES).map(k =>
  `<div class="cal-li"><div class="cal-dot" style="${TYPES[k].dot}"></div><span class="cal-ll">${TYPES[k].label}</span></div>`).join('');

function renderDetail(){
  const box = $('cal-detail');
  if (!selKey) { box.innerHTML = esc(C.hint); return; }
  const [y, m, d] = selKey.split('-').map(Number);
  const evs = evMap[selKey] || [];
  box.innerHTML = `<b>${m}월 ${d}일</b>` + (evs.length
    ? evs.map(e => `<span class="cal-tag ${e.type}">${esc(e.name)}</span>`).join('')
    : '등록된 일정이 없어요');
}

function renderCal(){
  const grid = $('cal-grid');
  grid.innerHTML = '';
  $('cal-month').textContent = `${vy}년 ${vm + 1}월`;
  $('cal-this').className = 'cal-btn' + (vy === today.getFullYear() && vm === today.getMonth() ? ' on' : '');

  const first = new Date(vy, vm, 1).getDay();
  const days = new Date(vy, vm + 1, 0).getDate();
  for (let i = 0; i < first; i++) {
    const e = document.createElement('div'); e.className = 'cal-cell empty'; grid.appendChild(e);
  }
  for (let d = 1; d <= days; d++) {
    const dow = (first + d - 1) % 7, key = mk(vy, vm, d);
    const isToday = vy === today.getFullYear() && vm === today.getMonth() && d === today.getDate();
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (isToday ? ' today' : '') + (dow === 0 ? ' sun' : '') + (dow === 6 ? ' sat' : '') + (key === selKey ? ' sel' : '');
    cell.innerHTML = `<div class="cal-num">${d}</div><div class="cal-tags">` +
      (evMap[key] || []).map(e => `<div class="cal-tag ${e.type}">${esc(e.name)}</div>`).join('') + '</div>';
    cell.onclick = () => { selKey = key; renderCal(); renderDetail(); };
    grid.appendChild(cell);
  }
}
function changeMo(n){
  vm += n;
  if (vm > 11) { vm = 0; vy++; }
  if (vm < 0) { vm = 11; vy--; }
  selKey = null; renderCal(); renderDetail();
}
$('cal-prev').onclick = () => changeMo(-1);
$('cal-next').onclick = () => changeMo(1);
$('cal-this').onclick = () => { vy = today.getFullYear(); vm = today.getMonth(); selKey = null; renderCal(); renderDetail(); };
renderCal(); renderDetail();

/* ===== 포트폴리오 ===== */
const P = CONFIG.portfolio;
let pcat = 'ALL', psub = '전체', pshown = P.pageSize;

function renderPortfolio(){
  $('p-tabs').innerHTML = ['ALL', ...P.cats].map(c =>
    `<button type="button" class="ptab ${c === pcat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');

  const subs = pcat === 'ALL' ? [] : [...new Set(P.items.filter(i => i.cat === pcat && i.sub).map(i => i.sub))];
  $('p-subs').innerHTML = subs.length
    ? ['전체', ...subs].map(s => `<button type="button" class="stab ${s === psub ? 'on' : ''}" data-s="${esc(s)}">${esc(s)}</button>`).join('')
    : '';

  const list = P.items.filter(i => (pcat === 'ALL' || i.cat === pcat) && (psub === '전체' || i.sub === psub));
  $('p-grid').innerHTML = list.length
    ? list.slice(0, pshown).map(i =>
        `<a class="pcard" href="${esc(i.img)}" target="_blank" rel="noopener">
           <span class="tag">${esc(i.cat)}</span>
           <div class="ttl" ${i.color ? `style="color:${esc(i.color)}"` : ''}>${esc(i.title || i.cat + ' Design')}</div>
           <img src="${esc(i.img)}" alt="${esc(i.cat)} 포트폴리오" loading="lazy">
         </a>`).join('')
    : '<div class="pempty">아직 등록된 작업이 없어요</div>';
  $('p-more').hidden = list.length <= pshown;
}
$('p-tabs').addEventListener('click', e => {
  const b = e.target.closest('.ptab'); if (!b) return;
  pcat = b.dataset.c; psub = '전체'; pshown = P.pageSize; renderPortfolio();
});
$('p-subs').addEventListener('click', e => {
  const b = e.target.closest('.stab'); if (!b) return;
  psub = b.dataset.s; pshown = P.pageSize; renderPortfolio();
});
$('p-more').onclick = () => { pshown += P.pageSize; renderPortfolio(); };
renderPortfolio();

/* ===== 문의 양식 ===== */
const F = CONFIG.form;
let colors = [];
let items = {};
let current = null;

$('f-pack').innerHTML = F.packages.map(p => `<option>${esc(p)}</option>`).join('');
$('f-extras').innerHTML = F.extras.map(e =>
  `<label class="pill"><input type="checkbox" name="extra" value="${esc(e)}"><span>${esc(e)}</span></label>`).join('');
$('f-rush').innerHTML = ['선택 안함', ...F.rush].map((r, i) =>
  `<label class="pill"><input type="radio" name="rush" value="${esc(r)}" ${i === 0 ? 'checked' : ''}><span>${esc(r)}</span></label>`).join('');

function renderItems(){
  $('f-items').innerHTML = F.items.map(n =>
    `<button type="button" class="item ${items[n] ? 'filled' : ''}" data-n="${esc(n)}"><span>${esc(n)}</span><small>${items[n] ? '입력됨 ✓' : '입력하기 ›'}</small></button>`).join('');
}
function renderChips(){
  $('f-chips').innerHTML = colors.map((c, i) =>
    `<span class="chip"><i style="background:${c}"></i>${c}<button type="button" data-i="${i}" aria-label="삭제">×</button></span>`).join('');
}
function closeEditor(){ current = null; $('f-editor').classList.remove('on'); }

$('f-items').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  current = b.dataset.n;
  $('f-edtitle').textContent = current + ' 입력';
  $('f-edtext').value = items[current] || '';
  $('f-editor').classList.add('on');
  $('f-edtext').focus();
});
$('f-edsave').onclick = () => {
  const t = $('f-edtext').value.trim();
  if (t) items[current] = t; else delete items[current];
  closeEditor(); renderItems(); update();
};
$('f-eddel').onclick = () => { delete items[current]; closeEditor(); renderItems(); update(); };
$('f-edclose').onclick = closeEditor;

$('f-color').addEventListener('input', () => { $('f-hex').value = $('f-color').value.toUpperCase(); });
$('f-hex').addEventListener('input', () => {
  const v = $('f-hex').value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) $('f-color').value = v;
});
$('f-addcolor').onclick = () => {
  let v = ($('f-hex').value.trim() || $('f-color').value).toUpperCase();
  if (!v.startsWith('#')) v = '#' + v;
  if (!/^#[0-9A-F]{6}$/.test(v)) { $('f-hex').focus(); return; }
  if (!colors.includes(v)) colors.push(v);
  renderChips(); update();
};
$('f-chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  colors.splice(+b.dataset.i, 1); renderChips(); update();
});

const v = id => $(id).value.trim() || '(미입력)';
function buildText(){
  const extras = [...document.querySelectorAll('input[name=extra]:checked')].map(x => x.value);
  const rush = document.querySelector('input[name=rush]:checked').value;
  const lines = Object.keys(items).map(k => `- ${k} : ${items[k].replace(/\n/g, '\n  ')}`);
  return [
    '[ 신청 내용 ]', '',
    `방송 닉네임 및 주소 : ${v('f-nick')}`,
    `수령 희망 날짜 : ${v('f-due')}`,
    `희망 샘플 공개일 : ${v('f-sample')}`,
    `패키지 선택 : ${$('f-pack').value}`,
    `원하는 색감 : ${colors.length ? colors.join(', ') : '(미입력)'}`,
    `원하는 요소 및 디자인 컨셉 : ${v('f-concept')}`, '',
    '[ 추가 옵션 ]',
    extras.length ? extras.map(x => `- ${x}`).join('\n') : '- 없음', '',
    `빠른 마감 옵션 : ${rush}`, '',
    '[ 신청 디자인 항목 ]',
    lines.length ? lines.join('\n') : '- (미선택)', '',
    '[ 그 외 추가 문의 사항 ]',
    v('f-etc')
  ].join('\n');
}
function update(){
  $('f-preview').value = buildText();
  $('f-copy').disabled = !$('f-read').checked;
}
$('f').addEventListener('input', update);
$('f').addEventListener('change', update);

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = $('f-preview'); ta.removeAttribute('readonly'); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.setAttribute('readonly', ''); return ok;
  }
}
$('f-copy').onclick = async () => {
  const ok = await copyText($('f-preview').value);
  const b = $('f-copy'), old = '신청 내용 복사하기';
  b.textContent = ok ? '복사 완료! 문의창에 붙여넣어 주세요' : '복사 실패 · 미리보기를 직접 복사해 주세요';
  setTimeout(() => b.textContent = old, 2800);
};
$('f-reset').onclick = () => {
  $('f').reset(); colors = []; items = {}; closeEditor(); renderChips(); renderItems(); update();
};
renderItems(); renderChips(); update();

/* 부모(아트머그)에 높이와 앵커 위치 전달 */
const ANCHORS = {schedule:'sec-schedule', form:'sec-form', portfolio:'sec-portfolio', notice:'sec-notice', price:'sec-price'};
function send(){
  const anchors = {};
  for (const k in ANCHORS) anchors[k] = $(ANCHORS[k]).getBoundingClientRect().top + scrollY;
  parent.postMessage({type:'embedHeight', height:document.documentElement.scrollHeight, anchors}, '*');
}
addEventListener('message', e => { if (e.data && e.data.type === 'requestHeight') send(); });
addEventListener('load', send);
new ResizeObserver(send).observe(document.body);
</script>
</body>
</html>
