<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상세페이지</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Noto+Sans+KR:wght@300;400;500&display=swap');
@font-face{font-family:'SchoolFont';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimAllimjangTTF-R.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'SchoolFont';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimAllimjangTTF-B.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Paperozi';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Paperozi';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}

:root{--p1:#ef94bc;--p2:#c4527e;--p3:#f5c6dc;--p4:#fce8f2;--p5:#fdf2f7;--sub:#d48aab;--mute:#c48aaa;--ink:#444}
*{box-sizing:border-box;margin:0}
/* 안쪽 스크롤바 숨김 (스크롤바 2개 방지) */
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
body{font-family:'Noto Sans KR',sans-serif;font-weight:300;color:var(--ink);background:transparent;padding:20px 16px 60px;line-height:1.6}
button,input,select,textarea{font-family:'Noto Sans KR',sans-serif;font-weight:300}
section{max-width:1120px;margin:0 auto 40px}

/* ---------- 공통 카드 (마감 캘린더 / 견적서 스타일) ---------- */
.card{background:#fff;border-radius:20px;overflow:hidden;border:1.5px solid var(--p3)}
.card-top{background:var(--p4);padding:28px 40px 18px;position:relative}
.diamond-pattern{position:absolute;inset:0;opacity:.22;background-image:repeating-linear-gradient(45deg,#ef94bc 0,#ef94bc 1px,transparent 1px,transparent 14px),repeating-linear-gradient(-45deg,#ef94bc 0,#ef94bc 1px,transparent 1px,transparent 14px)}
.top-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.chip{background:var(--p1);color:#fff;font-family:'SchoolFont',sans-serif;font-weight:400;font-size:13px;letter-spacing:2px;padding:3px 11px;border-radius:20px;display:inline-block;margin-bottom:6px}
.big-title{font-family:'Playfair Display',serif;font-weight:700;font-style:italic;font-size:62px;line-height:1;letter-spacing:2px;color:var(--p2)}
.big-title.md{font-size:48px}
.sub{font-size:9px;letter-spacing:3px;color:var(--sub);text-transform:uppercase;margin-top:8px}
.star-divider{display:flex;gap:5px;align-items:center;position:relative;z-index:1;padding-top:14px;flex-wrap:wrap}
.star{width:9px;height:9px;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--p1);opacity:.55;flex-shrink:0}
.star.sm{width:6px;height:6px;opacity:.35}
.card-body{padding:24px 40px 30px}
.section-label{font-size:9px;letter-spacing:3px;color:var(--p1);text-transform:uppercase;margin-bottom:10px;font-weight:500}
.divider{height:.5px;background:var(--p3);margin:16px 0}

/* 공통 버튼 */
.btn-save{background:var(--p1);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:13px;cursor:pointer;font-family:'SchoolFont',sans-serif;font-weight:400;letter-spacing:1px;transition:opacity .15s}
.btn-save:hover{opacity:.88}
.btn-cancel{background:var(--p4);color:var(--p2);border:none;border-radius:10px;padding:9px 18px;font-size:13px;cursor:pointer;font-family:'SchoolFont',sans-serif;font-weight:400;letter-spacing:1px;transition:background .15s}
.btn-cancel:hover{background:var(--p3)}
.btn-save:disabled{background:#e6dfe3;color:#fff;cursor:not-allowed;opacity:1}

/* ---------- 작업 일정 (달력) ---------- */
.nav-block{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.month-label{font-family:'SchoolFont',sans-serif;font-weight:400;font-size:17px;color:var(--p2);letter-spacing:1px}
.nav-btns{display:flex;gap:6px}
.nav-btn{background:#fff;border:1.5px solid var(--p3);color:var(--p1);border-radius:18px;padding:5px 14px;font-size:12px;font-family:'SchoolFont',sans-serif;font-weight:400;cursor:pointer;letter-spacing:1px;transition:background .15s}
.nav-btn:hover{background:var(--p4)}
.nav-btn.active{background:var(--p1);color:#fff;border-color:var(--p1)}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.wday{text-align:center;font-size:10px;letter-spacing:2px;color:var(--p1);padding:5px 0;font-weight:500}
.wday.sat{color:#88b4d8}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day-cell{min-height:96px;border-radius:12px;border:.5px solid var(--p4);background:#fff;padding:7px 8px 6px;cursor:pointer;transition:border-color .15s,box-shadow .12s;position:relative;display:flex;flex-direction:column;min-width:0}
.day-cell:hover{border-color:var(--p3);box-shadow:0 0 0 2.5px #fce8f255}
.day-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.day-cell.today{background:var(--p4);border-color:var(--p1)}
.day-cell.sel{border-color:var(--p1);box-shadow:0 0 0 2.5px var(--p4)}
.day-cell.sunday .day-num{color:#e8609a}
.day-cell.saturday .day-num{color:#88b4d8}
.day-num{font-size:14px;font-weight:500;color:#555;margin-bottom:4px}
.day-cell.today .day-num{color:var(--p2);font-weight:700}
.tags{display:flex;flex-direction:column;gap:2px;flex:1;overflow:hidden}
.tag{font-family:'SchoolFont',sans-serif;font-weight:400;font-size:9px;border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.closed{background:var(--p4);color:var(--p2)}
.tag.holiday{background:var(--p3);color:#9e3060}
.cal-detail{margin-top:14px;padding:12px 16px;border:1.5px dashed var(--p3);border-radius:12px;background:#fffafc;font-size:13px;color:#a8798f}
.cal-detail b{font-family:'SchoolFont',sans-serif;font-weight:400;color:var(--p2);font-size:15px;margin-right:8px}
.cal-detail .tag{display:inline-block;font-size:12px;padding:3px 9px;margin:2px 4px 2px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px;background:var(--p5);border-radius:12px;margin-top:14px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.legend-label{font-family:'SchoolFont',sans-serif;font-weight:400;font-size:12px;color:var(--mute)}
.footer-area{margin-top:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.footer-stars{display:flex;flex-direction:column;gap:5px}
.footer-row{display:flex;gap:5px}
.thanks{font-family:'Paperozi',sans-serif;font-weight:500;font-size:14px;letter-spacing:1px;color:var(--p1);text-align:right;line-height:1.7}
.thanks.lg{font-size:20px;line-height:1.35;letter-spacing:2px}

/* ---------- 문의 양식 ---------- */
.fq{margin-bottom:22px}
.fl{display:block;font-family:'SchoolFont',sans-serif;font-weight:400;font-size:14px;color:var(--p2);letter-spacing:1px;margin-bottom:8px}
.fl b{color:var(--p1);margin-right:6px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.form input[type=text],.form input[type=date],.form select,.form textarea{width:100%;font-size:13px;color:#333;background:#fff;border:1px solid var(--p3);border-radius:9px;padding:9px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--p1);box-shadow:0 0 0 3px var(--p4)}
.form textarea{resize:vertical;min-height:110px;line-height:1.7}
.hint{font-size:11px;color:var(--mute);margin-top:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:6px 16px;border:1.5px solid var(--p3);border-radius:18px;background:#fff;cursor:pointer;font-family:'SchoolFont',sans-serif;font-weight:400;font-size:13px;letter-spacing:1px;color:var(--p2);transition:background .15s,color .15s,border-color .15s}
.pill span:hover{background:var(--p4)}
.pill input:checked+span{background:var(--p1);border-color:var(--p1);color:#fff}
.pill input:focus-visible+span{box-shadow:0 0 0 3px var(--p4)}
.pill em{font-style:normal;font-size:12px;color:var(--p1);margin-left:4px}
.pill input:checked+span em{color:#fff}
.colorrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.colorrow input[type=color]{width:40px;height:40px;border:1px solid var(--p3);border-radius:10px;padding:3px;background:#fff;cursor:pointer}
.colorrow input[type=text]{width:140px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--p3);border-radius:18px;padding:3px 8px 3px 6px;background:#fff;font-family:'SchoolFont',sans-serif;font-weight:400;font-size:12px;color:var(--p2)}
.cchip i{width:16px;height:16px;border-radius:50%;border:1px solid #ddd;display:inline-block}
.cchip button{border:0;background:none;cursor:pointer;color:var(--p3);font-size:16px;line-height:1}
.cchip button:hover{color:#e8609a}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid var(--p3);border-radius:12px;background:#fff;cursor:pointer;font-size:13px;font-weight:400;color:#444;text-align:left;transition:background .15s,border-color .15s}
.item small{font-family:'SchoolFont',sans-serif;font-weight:400;font-size:11px;color:var(--mute)}
.item:hover{border-color:var(--p1)}
.item.filled{background:var(--p4);border-color:var(--p1)}
.item.filled small{color:var(--p2)}
.editor{display:none;margin-top:12px;border:1.5px dashed var(--p3);border-radius:12px;padding:14px;background:#fffafc}
.editor.on{display:block}
.editor h4{font-family:'SchoolFont',sans-serif;font-weight:400;font-size:14px;margin-bottom:8px;color:var(--p2)}
.editor .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#f-preview{background:var(--p5);min-height:240px;resize:none;overflow:hidden;font-size:12.5px;line-height:1.8}
.check{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:13px;font-weight:400;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--p1)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .main{flex:1;padding:13px}
.notes-section{background:var(--p5);border-radius:12px;padding:14px 16px;margin-top:16px}
.notes-text{font-family:'SchoolFont',sans-serif;font-weight:400;font-size:12px;color:var(--mute);line-height:2}

/* ---------- 포트폴리오 ---------- */
.ptabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:12px}
.ptab{font-family:'SchoolFont',sans-serif;font-weight:400;font-size:13px;letter-spacing:1px;padding:6px 18px;border-radius:18px;border:1.5px solid var(--p3);background:#fff;color:var(--p1);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.ptab:hover{background:var(--p4)}
.ptab.on{background:var(--p1);border-color:var(--p1);color:#fff}
.stabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:18px}
.stabs:empty{display:none}
.stab{font-family:'SchoolFont',sans-serif;font-weight:400;font-size:12px;letter-spacing:1px;padding:4px 14px;border-radius:14px;border:1.5px solid var(--p3);background:#fff;color:var(--mute);cursor:pointer;transition:background .15s,color .15s}
.stab:hover{background:var(--p4)}
.stab.on{background:var(--p2);border-color:var(--p2);color:#fff}
.pgrid{display:flex;gap:14px;align-items:flex-start}
.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}
.pcard{position:relative;display:block;background:#fff;border:1.5px solid var(--p3);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;cursor:zoom-in;transition:transform .2s,border-color .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-3px);border-color:var(--p1);box-shadow:0 12px 24px -14px rgba(226,110,160,.6)}
.pcard .ttl{text-align:center;font-family:'SchoolFont',sans-serif;font-weight:400;font-size:13px;padding:10px 0 4px;color:var(--p2)}
.pcard .ttl::before{content:"⁝ "}
.pcard .ttl::after{content:" ⁝"}
.pcard .ptag{position:absolute;top:10px;right:10px;z-index:1;font-family:'SchoolFont',sans-serif;font-weight:400;font-size:11px;color:#fff;background:var(--p1);border-radius:6px;padding:2px 8px}
.pcard img{width:100%;height:auto;display:block;background:var(--p5)}
.pempty{width:100%;text-align:center;color:var(--mute);padding:40px 0;font-family:'SchoolFont',sans-serif}
.more{display:block;margin:20px auto 0}
.more[hidden]{display:none}

/* ---------- 공지 ---------- */
.notice{list-style:none}
.notice li{position:relative;padding:3px 0 3px 18px}
.notice li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--p1);opacity:.7}

/* ---------- 이미지 크게 보기 (같은 화면 + 뒷배경 블러) ---------- */
.lb{position:absolute;left:0;top:0;width:100%;z-index:1000}
.lb[hidden]{display:none}
.lb-bg{position:absolute;inset:0;background:rgba(255,245,249,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lb-box{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;padding:0 64px}
.lb-in{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;min-width:0}
.lb-in img{display:block;max-width:100%;width:auto;height:auto;border-radius:14px;border:3px solid #fff;box-shadow:0 20px 50px -20px rgba(196,82,126,.55);background:#fff}
.lb-cap{font-family:'SchoolFont',sans-serif;font-size:13px;color:var(--p2);text-align:center}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1.5px solid var(--p3);background:#fff;color:var(--p2);font-size:26px;line-height:1;cursor:pointer}
.lb-nav[hidden]{display:none}
.lb-prev{left:12px}
.lb-next{right:12px}
.lb-x{position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:50%;border:0;background:var(--p1);color:#fff;font-size:24px;line-height:1;cursor:pointer}

/* ---------- 주문 항목별 양식 ---------- */
.ef{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.ef-row.full{grid-column:1/-1}
.ef-row label{display:block;font-family:'SchoolFont',sans-serif;font-weight:400;font-size:12px;color:var(--p2);letter-spacing:1px;margin-bottom:4px}
.ef textarea{min-height:76px}
@media(max-width:640px){.ef{grid-template-columns:1fr}}

@media(max-width:640px){.grid2{grid-template-columns:1fr}}
@media(max-width:560px){
  .card-top{padding:20px 18px 14px}
  .big-title{font-size:40px}
  .big-title.md{font-size:34px}
  .card-body{padding:16px 14px 20px}
  .nav-block{align-items:flex-start}
  .days-grid,.weekdays{gap:3px}
  .day-cell{min-height:62px;padding:5px 4px;border-radius:9px}
  .day-num{font-size:12px}
  .tag{font-size:8px;padding:1px 3px}
  .thanks{font-size:12px}
  .thanks.lg{font-size:15px}
}
</style>
</head>
<body>

<!-- 작업 일정 -->
<section id="sec-schedule">
  <div class="card">
    <div class="card-top">
      <div class="diamond-pattern"></div>
      <div class="top-inner">
        <div>
          <div class="chip" id="cal-chip"></div>
          <div class="big-title" id="cal-title"></div>
          <div class="sub" id="cal-sub"></div>
        </div>
        <div class="nav-block">
          <div class="month-label" id="cal-month"></div>
          <div class="nav-btns">
            <button type="button" class="nav-btn" id="cal-this">이번달</button>
            <button type="button" class="nav-btn" id="cal-prev">◂ 이전</button>
            <button type="button" class="nav-btn" id="cal-next">다음 ▸</button>
          </div>
        </div>
      </div>
      <div class="star-divider"></div>
    </div>
    <div class="card-body">
      <div class="section-label">Schedule Overview</div>
      <div class="weekdays">
        <div class="wday">일</div><div class="wday">월</div><div class="wday">화</div><div class="wday">수</div><div class="wday">목</div><div class="wday">금</div><div class="wday sat">토</div>
      </div>
      <div class="days-grid" id="cal-grid"></div>
      <div class="cal-detail" id="cal-detail"></div>
      <div class="legend" id="cal-legend"></div>
      <div class="divider"></div>
      <div class="footer-area">
        <div class="footer-stars" id="cal-fstars"></div>
        <div class="thanks" id="cal-thanks"></div>
      </div>
    </div>
  </div>
</section>

<!-- 문의 양식 -->
<section id="sec-form">
  <div class="card">
    <div class="card-top">
      <div class="diamond-pattern"></div>
      <div class="top-inner"><div>
        <div class="chip">문의 양식</div>
        <div class="big-title md">FORM.</div>
        <div class="sub">Commission Request</div>
      </div></div>
      <div class="star-divider"></div>
    </div>
    <div class="card-body form">
      <form id="f" onsubmit="return false">

        <div class="grid2">
          <div class="fq"><label class="fl" for="f-nick"><b>1.</b>방송 닉네임 및 주소</label>
            <input type="text" id="f-nick" placeholder="방송 닉네임과 주소를 입력해주세요"></div>
          <div class="fq"><label class="fl" for="f-due"><b>2.</b>수령 희망 날짜</label>
            <input type="date" id="f-due"></div>
          <div class="fq"><label class="fl" for="f-sample"><b>3.</b>희망 샘플 공개일</label>
            <input type="date" id="f-sample"></div>
          <div class="fq" id="f-packwrap"><label class="fl" for="f-pack"><b>4.</b>패키지 선택</label>
            <select id="f-pack"></select></div>
        </div>

        <div class="fq"><label class="fl"><b>5.</b>원하는 색감</label>
          <div class="colorrow">
            <input type="color" id="f-color" value="#ffffff" aria-label="색상 선택">
            <input type="text" id="f-hex" placeholder="#FFFFFF" maxlength="7">
            <button type="button" class="btn-save" id="f-addcolor">+ 추가</button>
          </div>
          <div class="chips" id="f-chips"></div>
        </div>

        <div class="fq"><label class="fl" for="f-concept"><b>6.</b>원하는 요소 및 디자인 컨셉</label>
          <textarea id="f-concept" placeholder="원하는 색감, 요소, 참고자료 첨부 등 상세한 내용을 적어주세요"></textarea>
          <div class="hint">오마카세 및 부실한 설명으로 시작된 작업은 추후 수정이 어렵습니다.</div></div>

        <div class="fq"><label class="fl"><b>7.</b>추가 옵션</label><div class="pills" id="f-extras"></div></div>
        <div class="fq"><label class="fl"><b>8.</b>빠른 마감 옵션</label><div class="pills" id="f-rush"></div></div>

        <div class="fq"><label class="fl"><b>9.</b>신청 하실 디자인 항목</label>
          <div class="items" id="f-items"></div>
          <div class="editor" id="f-editor">
            <h4 id="f-edtitle"></h4>
            <div class="ef" id="f-edfields"></div>
            <div class="acts">
              <button type="button" class="btn-save" id="f-edsave">저장</button>
              <button type="button" class="btn-cancel" id="f-eddel">이 항목 삭제</button>
              <button type="button" class="btn-cancel" id="f-edclose">닫기</button>
            </div>
          </div>
        </div>

        <div class="fq"><label class="fl" for="f-etc"><b>10.</b>그 외 추가 문의 사항</label>
          <textarea id="f-etc" placeholder="자유롭게 작성해주세요" style="min-height:90px"></textarea></div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const starHTML = (n, sm) => Array(n).fill(`<div class="star${sm ? ' sm' : ''}"></div>`).join('');
const starRows = () => `<div class="footer-row">${starHTML(5)}</div><div class="footer-row">${starHTML(3)}</div>`;

/* 헤더 별 장식 */
document.querySelectorAll('.star-divider').forEach(el => { el.innerHTML = starHTML(22) + starHTML(5, true); });

/* 공지 / 맺음말 */

$('end-thanks').innerHTML = CONFIG.thanks;

/* ===== 작업 일정 (달력, 읽기 전용) ===== */
const C = CONFIG.calendar;
const TYPES = {
  closed:  {label:'마감',     dot:'background:#fce8f2;border:1px solid #f5c6dc'},
  holiday: {label:'작업불가', dot:'background:#f5c6dc'}
};
const pad = n => String(n).padStart(2, '0');
const mk = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const evMap = {};
C.events.forEach(e => {
  const from = e.from || e.date, to = e.to || from;
  if (!from) return;
  const [fy, fm, fd] = from.split('-').map(Number);
  const [ty, tm, td] = to.split('-').map(Number);
  const cur = new Date(fy, fm - 1, fd), end = new Date(ty, tm - 1, td);
  for (let n = 0; cur <= end && n < 400; n++) {
    const k = mk(cur.getFullYear(), cur.getMonth(), cur.getDate());
    (evMap[k] = evMap[k] || []).push({name: e.name, type: TYPES[e.type] ? e.type : 'closed'});
    cur.setDate(cur.getDate() + 1);
  }
});

const today = new Date();
let vy = today.getFullYear(), vm = today.getMonth(), selKey = null;

$('cal-chip').textContent = C.chip;
$('cal-title').textContent = C.title;
$('cal-sub').textContent = C.sub;
$('cal-fstars').innerHTML = starRows();
$('cal-thanks').innerHTML = `${esc(C.hint)}<br>${esc(C.footer)}`;
$('cal-legend').innerHTML = Object.keys(TYPES).map(k =>
  `<div class="legend-item"><div class="legend-dot" style="${TYPES[k].dot}"></div><span class="legend-label">${TYPES[k].label}</span></div>`).join('');

function renderDetail(){
  const box = $('cal-detail');
  if (!selKey) { box.innerHTML = esc(C.hint); return; }
  const [y, m, d] = selKey.split('-').map(Number);
  const evs = evMap[selKey] || [];
  box.innerHTML = `<b>${m}월 ${d}일</b>` + (evs.length
    ? evs.map(e => `<span class="tag ${e.type}">${esc(e.name)}</span>`).join('')
    : '등록된 일정이 없어요');
}
function renderCal(){
  const grid = $('cal-grid');
  grid.innerHTML = '';
  $('cal-month').textContent = `${vy}년 ${vm + 1}월`;
  $('cal-this').className = 'nav-btn' + (vy === today.getFullYear() && vm === today.getMonth() ? ' active' : '');
  const first = new Date(vy, vm, 1).getDay();
  const days = new Date(vy, vm + 1, 0).getDate();
  for (let i = 0; i < first; i++) {
    const e = document.createElement('div'); e.className = 'day-cell empty'; grid.appendChild(e);
  }
  for (let d = 1; d <= days; d++) {
    const dow = (first + d - 1) % 7, key = mk(vy, vm, d);
    const isToday = vy === today.getFullYear() && vm === today.getMonth() && d === today.getDate();
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (isToday ? ' today' : '') + (dow === 0 ? ' sunday' : '') + (dow === 6 ? ' saturday' : '') + (key === selKey ? ' sel' : '');
    cell.innerHTML = `<div class="day-num">${d}</div><div class="tags">` +
      (evMap[key] || []).map(e => `<div class="tag ${e.type}">${esc(e.name)}</div>`).join('') + '</div>';
    cell.onclick = () => { selKey = key; renderCal(); renderDetail(); };
    grid.appendChild(cell);
  }
}
function changeMo(n){
  vm += n;
  if (vm > 11) { vm = 0; vy++; }
  if (vm < 0) { vm = 11; vy--; }
  selKey = null; renderCal(); renderDetail();
}
$('cal-prev').onclick = () => changeMo(-1);
$('cal-next').onclick = () => changeMo(1);
$('cal-this').onclick = () => { vy = today.getFullYear(); vm = today.getMonth(); selKey = null; renderCal(); renderDetail(); };
renderCal(); renderDetail();

/* ===== 포트폴리오 ===== */
const RAW = 'https://raw.githubusercontent.com/bakkssi/pyeonssi/main/';   // 방금 올린 이미지를 바로 보여주기 위한 주소
const isRel = s => !/^(https?:)?\/\//.test(s);
const P = CONFIG.portfolio;
let pcat = 'ALL', psub = '전체', pshown = P.pageSize;

function colCount(){ const w = document.documentElement.clientWidth; return w >= 760 ? 3 : (w >= 480 ? 2 : 1); }
let shownList = [], lastCols = 0;
function cardHTML(i, idx){
  const rel = isRel(i.img);
  const ar = i.r > 0 ? ` style="aspect-ratio:${(1 / i.r).toFixed(4)}"` : '';
  const fb = rel ? ` data-raw="${esc(RAW + i.img)}" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=this.dataset.raw}"` : '';
  return `<a class="pcard" href="${esc(rel ? RAW + i.img : i.img)}" data-i="${idx}">
    <span class="ptag">${esc(i.cat)}</span>
    <div class="ttl" ${i.color ? `style="color:${esc(i.color)}"` : ''}>${esc(i.title || i.cat + ' Design')}</div>
    <img src="${esc(i.img)}"${ar}${fb} alt="${esc(i.cat)} 포트폴리오" loading="lazy">
  </a>`;
}
function renderPortfolio(){
  $('p-tabs').innerHTML = ['ALL', ...P.cats].map(c =>
    `<button type="button" class="ptab ${c === pcat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const subs = pcat === 'ALL' ? [] : [...new Set(P.items.filter(i => i.cat === pcat && i.sub).map(i => i.sub))];
  $('p-subs').innerHTML = subs.length
    ? ['전체', ...subs].map(s => `<button type="button" class="stab ${s === psub ? 'on' : ''}" data-s="${esc(s)}">${esc(s)}</button>`).join('')
    : '';
  const list = P.items.filter(i => (pcat === 'ALL' || i.cat === pcat) && (psub === '전체' || i.sub === psub));
  shownList = list.slice(0, pshown);
  lastCols = colCount();
  if (!shownList.length) {
    $('p-grid').innerHTML = '<div class="pempty">아직 등록된 작업이 없어요</div>';
  } else {
    /* 한 줄에 3장씩, 이미지 비율 그대로. 가장 짧은 칸에 차례로 쌓아요 */
    const hs = Array(lastCols).fill(0), bk = Array.from({length: lastCols}, () => []);
    shownList.forEach((i, idx) => {
      const c = hs.indexOf(Math.min(...hs));
      bk[c].push(cardHTML(i, idx));
      hs[c] += (i.r > 0 ? i.r : 1.25) + 0.15;
    });
    $('p-grid').innerHTML = bk.map(b => `<div class="mcol">${b.join('')}</div>`).join('');
  }
  $('p-more').hidden = list.length <= pshown;
}
let rzT;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (colCount() !== lastCols) renderPortfolio(); }, 200); });
$('p-tabs').addEventListener('click', e => {
  const b = e.target.closest('.ptab'); if (!b) return;

  const b = e.target.closest('.stab'); if (!b) return;
  psub = b.dataset.s; pshown = P.pageSize; renderPortfolio();

const docHeight = () => Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);

  const i = shownList[lbIdx]; if (!i) return;
  const rel = isRel(i.img);
  lbImg.onerror = () => { if (rel && lbImg.src !== RAW + i.img) lbImg.src = RAW + i.img; };
  lbImg.src = i.img;
  $('lb-cap').textContent = [i.title, i.cat + (i.sub ? ' · ' + i.sub : '')].filter(Boolean).join('  |  ');
  $('lb-prev').hidden = lbIdx <= 0;
  $('lb-next').hidden = lbIdx >= shownList.length - 1;
}
function placeLB(){
  const sh = Math.min((window.screen && screen.availHeight) || 800, 1000);
  let top, h;
  if (vp) { top = vp.top; h = vp.height; }              // 아트머그가 알려준 지금 보이는 화면
  else { h = Math.round(sh * 0.85); top = lbY - h / 2; } // 못 받으면 누른 위치 기준으로 추정
  const dh = docHeight() || 1e6;
  h = Math.min(h, dh); top = Math.max(0, Math.min(top, dh - h));
  lbBox.style.top = top + 'px'; lbBox.style.height = h + 'px';
  lbImg.style.maxHeight = Math.max(220, h - 120) + 'px';
}
function openLB(idx, y){
  lbIdx = idx; lbY = y; vp = null;
  lb.style.height = docHeight() + 'px';
  lb.hidden = false; showLB(); placeLB();
  try { parent.postMessage({type: 'getViewport'}, '*'); } catch(e) {}
}
function closeLB(){ lb.hidden = true; lbImg.removeAttribute('src'); }
function stepLB(d){ const n = lbIdx + d; if (n < 0 || n >= shownList.length) return; lbIdx = n; showLB(); }
$('p-grid').addEventListener('click', e => {
  const a = e.target.closest('.pcard'); if (!a) return;
  e.preventDefault();
  openLB(+a.dataset.i, e.clientY + (window.scrollY || 0));
});
lb.addEventListener('click', e => {
  if (e.target.closest('#lb-x')) closeLB();
  else if (e.target.closest('#lb-prev')) stepLB(-1);
  else if (e.target.closest('#lb-next')) stepLB(1);
  else if (!e.target.closest('#lb-img')) closeLB();
});
document.addEventListener('keydown', e => {
  if (lb.hidden) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') stepLB(-1);
  if (e.key === 'ArrowRight') stepLB(1);
});

/* portfolio.json (관리 페이지에서 저장되는 파일)을 불러와서 표시
   GitHub 원본(저장 직후 바로 반영)과 사이트 파일을 동시에 불러오고, 원본이 늦거나 막혀 있으면 4초 뒤 사이트 파일로 표시해요 */
function getJSON(u, ms){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  return fetch(u, {cache: 'no-store', signal: c.signal})
    .then(r => { clearTimeout(t); if (!r.ok) throw 0; return r.json(); })
    .catch(() => { clearTimeout(t); return null; });
}
async function loadPortfolio(){
  const t = Date.now();
  const [a, b] = await Promise.all([getJSON(RAW + 'portfolio.json?t=' + t, 4000), getJSON('portfolio.json?v=' + t, 4000)]);
  const j = [a, b].find(x => x && Array.isArray(x.items));
  if (j) { P.items = j.items; if (Array.isArray(j.cats) && j.cats.length) P.cats = j.cats; }
  renderPortfolio();
}
loadPortfolio();

/* ===== 문의 양식 ===== */
const F = CONFIG.form;
const RUSH = [{name:'선택 안함', price:0}, ...F.rush];
const won = n => n ? ` (+${n.toLocaleString()}원)` : '';
const priceTag = n => n ? `<em>+${n.toLocaleString()}원</em>` : '';
let colors = [];
let items = {};
let current = null;

if (F.packages.length) $('f-pack').innerHTML = F.packages.map(p => `<option>${esc(p)}</option>`).join('');
else $('f-packwrap').style.display = 'none';

$('f-extras').innerHTML = F.extras.map((e, i) =>
  `<label class="pill"><input type="checkbox" name="extra" value="${i}"><span>${esc(e.name)} ${priceTag(e.price)}</span></label>`).join('');
$('f-rush').innerHTML = RUSH.map((r, i) =>
  `<label class="pill"><input type="radio" name="rush" value="${i}" ${i === 0 ? 'checked' : ''}><span>${esc(r.name)} ${priceTag(r.price)}</span></label>`).join('');

function renderItems(){
  $('f-items').innerHTML = F.items.map(n =>
    `<button type="button" class="item ${items[n] ? 'filled' : ''}" data-n="${esc(n)}"><span>${esc(n)}</span><small>${items[n] ? '입력됨 ✓' : '입력하기 ›'}</small></button>`).join('');
}
function renderChips(){
  $('f-chips').innerHTML = colors.map((c, i) =>
    `<span class="cchip"><i style="background:${c}"></i>${c}<button type="button" data-i="${i}" aria-label="삭제">×</button></span>`).join('');
}
function closeEditor(){ current = null; $('f-editor').classList.remove('on'); }

function fieldsFor(name){
  const f = (F.forms || {})[name];
  return (f && f.length) ? f : [{k:'요청 내용', t:'area', ph:'수량, 사이즈, 문구 등 필요한 내용을 적어주세요'}];
}
$('f-items').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  current = b.dataset.n;
  const vals = items[current] || {};
  $('f-edtitle').textContent = current + ' 양식';
  $('f-edfields').innerHTML = fieldsFor(current).map((f, i) => {
    const id = 'ef-' + i, val = vals[f.k] || '', k = esc(f.k), ph = esc(f.ph || '');
    let ctl;
    if (f.t === 'area') ctl = `<textarea id="${id}" data-k="${k}" placeholder="${ph}">${esc(val)}</textarea>`;
    else if (f.t === 'select') ctl = `<select id="${id}" data-k="${k}"><option value="">선택 안함</option>${(f.opts || []).map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else ctl = `<input type="${f.t === 'date' ? 'date' : 'text'}" id="${id}" data-k="${k}" value="${esc(val)}" placeholder="${ph}">`;
    return `<div class="ef-row ${f.t === 'area' ? 'full' : ''}"><label for="${id}">${k}</label>${ctl}</div>`;
  }).join('');
  $('f-editor').classList.add('on');
  const first = $('f-edfields').querySelector('[data-k]'); if (first) first.focus();
});
$('f-edsave').onclick = () => {
  const vals = {};
  $('f-edfields').querySelectorAll('[data-k]').forEach(el => { const t = el.value.trim(); if (t) vals[el.dataset.k] = t; });
  if (Object.keys(vals).length) items[current] = vals; else delete items[current];
  closeEditor(); renderItems(); update();
};
$('f-eddel').onclick = () => { delete items[current]; closeEditor(); renderItems(); update(); };
$('f-edclose').onclick = closeEditor;

$('f-color').addEventListener('input', () => { $('f-hex').value = $('f-color').value.toUpperCase(); });
$('f-hex').addEventListener('input', () => {
  const v = $('f-hex').value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) $('f-color').value = v;
});
$('f-addcolor').onclick = () => {
  let v = ($('f-hex').value.trim() || $('f-color').value).toUpperCase();
  if (!v.startsWith('#')) v = '#' + v;
  if (!/^#[0-9A-F]{6}$/.test(v)) { $('f-hex').focus(); return; }
  if (!colors.includes(v)) colors.push(v);
  renderChips(); update();
};
$('f-chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  colors.splice(+b.dataset.i, 1); renderChips(); update();
});

const v = id => $(id).value.trim() || '(미입력)';
function buildText(){
  const exs = [...document.querySelectorAll('input[name=extra]:checked')].map(x => F.extras[+x.value]);
  const rs = RUSH[+document.querySelector('input[name=rush]:checked').value];
  const sum = exs.reduce((a, e) => a + (e.price || 0), 0) + (rs.price || 0);
  const lines = Object.keys(items).map(k => `- ${k}\n` + Object.keys(items[k]).map(f => `  · ${f} : ${String(items[k][f]).replace(/\n/g, '\n    ')}`).join('\n'));
  return [
    '[ 신청 내용 ]', '',
    `방송 닉네임 및 주소 : ${v('f-nick')}`,
    `수령 희망 날짜 : ${v('f-due')}`,
    `희망 샘플 공개일 : ${v('f-sample')}`,
    ...(F.packages.length ? [`패키지 선택 : ${$('f-pack').value}`] : []),
    `원하는 색감 : ${colors.length ? colors.join(', ') : '(미입력)'}`,
    `원하는 요소 및 디자인 컨셉 : ${v('f-concept')}`, '',
    '[ 추가 옵션 ]',
    exs.length ? exs.map(e => `- ${e.name}${won(e.price)}`).join('\n') : '- 없음', '',
    `빠른 마감 옵션 : ${rs.name}${won(rs.price)}`,
    ...(sum ? [`추가금 합계 : +${sum.toLocaleString()}원`] : []), '',
    '[ 신청 디자인 항목 ]',
    lines.length ? lines.join('\n') : '- (미선택)', '',
    '[ 그 외 추가 문의 사항 ]',
    v('f-etc')
  ].join('\n');
}
function update(){
  const ta = $('f-preview');
  ta.value = buildText();
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight + 4) + 'px';   // 미리보기 칸 안에 스크롤바가 생기지 않게 자동 높이
  $('f-copy').disabled = !$('f-read').checked;
}
$('f').addEventListener('input', update);
$('f').addEventListener('change', update);

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = $('f-preview'); ta.removeAttribute('readonly'); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.setAttribute('readonly', ''); return ok;
  }
}
$('f-copy').onclick = async () => {
  const ok = await copyText($('f-preview').value);
  const b = $('f-copy'), old = '신청 내용 복사하기';
  b.textContent = ok ? '복사 완료! 문의창에 붙여넣어 주세요' : '복사 실패 · 미리보기를 직접 복사해 주세요';
  setTimeout(() => b.textContent = old, 2800);
};
$('f-reset').onclick = () => {
  $('f').reset(); colors = []; items = {}; closeEditor(); renderChips(); renderItems(); update();
};
renderItems(); renderChips(); update();

/* ===== 부모(아트머그)에 높이와 앵커 위치 전달 ===== */
const ANCHORS = {schedule:'sec-schedule', form:'sec-form', portfolio:'sec-portfolio', notice:'sec-notice'};
const docH = () => Math.ceil(document.body.getBoundingClientRect().height);
let lastH = 0;
function send(){
  const anchors = {};
  for (const k in ANCHORS) anchors[k] = $(ANCHORS[k]).getBoundingClientRect().top + scrollY;
  lastH = docH();
  parent.postMessage({type:'embedHeight', height:lastH, anchors}, '*');
}
addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'requestHeight') send();
  if (d.type === 'viewport' && d.height > 0) { vp = {top: +d.top || 0, height: +d.height}; if (!lb.hidden) placeLB(); }
});
addEventListener('load', send);
addEventListener('resize', send);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(send);
new ResizeObserver(send).observe(document.body);
setInterval(() => { if (docH() !== lastH) send(); }, 600);   // 글꼴·이미지가 늦게 불러와져도 높이 재전송
</script>
</body>
